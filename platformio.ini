; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Common settings for all ESP32-S3 environments
[env]
platform = espressif32@6.13.0
framework = arduino
build_src_filter =
	+<*>
	-<display_test.cpp>
	-<touch_test.cpp>
lib_deps = 
	WiFi
	Preferences
	adafruit/Adafruit AHTX0@^2.0.6
	adafruit/Adafruit Unified Sensor@^1.1.15
	adafruit/DHT sensor library@^1.4.7
	adafruit/Adafruit BME280 Library@^2.2.4
	adafruit/Adafruit BME680 Library@^2.0.6
	adafruit/Adafruit SHT4x Library@^1.0.1
	paulstoffregen/OneWire@^2.3.7
	milesburton/DallasTemperature@^4.0.6
	lovyan03/LovyanGFX@^1.2.0
    esp32async/AsyncTCP@^3.4.9
	 esp32async/ESPAsyncWebServer@^3.11.0
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.4.3
	iavorvel/MyLD2410@^1.2.8
lib_ignore = 
	AsyncTCP_RP2040W
monitor_speed = 115200
monitor_port = /dev/ttyACM*
upload_port = /dev/ttyACM*
build_flags = 
    -w
    -Wno-unused-variable
    -Wno-unused-function
    -Wno-unused-but-set-variable
    -Wno-sign-compare
build_unflags = 
    -Wall
    -Wextra

; ESP32-S3-WROOM-1-N8 (8MB Flash, No PSRAM)
[env:esp32-s3-wroom-1-n8]
board = esp32-s3-thermostat
board_build.mcu = esp32s3
board_build.flash_size = 8MB
board_build.partitions = default_8mb.csv

; ESP32-S3-WROOM-1-N16 (16MB Flash, No PSRAM) - DEFAULT
[env:esp32-s3-wroom-1-n16]
board = esp32-s3-thermostat
board_build.mcu = esp32s3
board_build.flash_size = 16MB
board_build.partitions = default_16mb.csv

; ESP32-S3-WROOM-1-N32R16V (32MB Flash, 16MB PSRAM)
[env:esp32-s3-wroom-1-n32r16v]
board = esp32-s3-thermostat
board_build.mcu = esp32s3
board_build.flash_size = 32MB
board_build.partitions = default_32mb.csv
board_build.arduino.memory_type = qio_opi
build_flags = 
    ${env.build_flags}
    -DBOARD_HAS_PSRAM

; Touch test firmware (builds only src/touch_test.cpp)
[env:touch_test]
board = esp32-s3-thermostat
board_build.mcu = esp32s3
board_build.flash_size = 16MB
board_build.partitions = default_16mb.csv
build_src_filter =
	-<*>
	+<touch_test.cpp>
monitor_speed = 115200

; Touch test firmware forced to ILI9488 4" display (for panels that don't respond to ID probe)
[env:touch_test_4in]
board = esp32-s3-thermostat
board_build.mcu = esp32s3
board_build.flash_size = 16MB
board_build.partitions = default_16mb.csv
build_src_filter =
	-<*>
	+<touch_test.cpp>
build_flags =
	${env.build_flags}
	-DFORCE_DISPLAY_ILI9488
monitor_speed = 115200

; Display test firmware (builds only src/display_test.cpp)
[env:display_test]
board = esp32-s3-thermostat
board_build.mcu = esp32s3
board_build.flash_size = 16MB
board_build.partitions = default_16mb.csv
build_src_filter =
	-<*>
	+<display_test.cpp>
monitor_speed = 115200

